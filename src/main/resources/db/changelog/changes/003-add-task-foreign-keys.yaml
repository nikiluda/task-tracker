databaseChangeLog:
  - changeSet:
      id: 003-add-task-foreign-keys
      author: zhanlin
      changes:

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tasks_owner

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: assignee_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tasks_assignee

        - createIndex:
            tableName: tasks
            indexName: idx_tasks_owner_id
            columns:
              - column:
                  name: owner_id

        - createIndex:
            tableName: tasks
            indexName: idx_tasks_assignee_id
            columns:
              - column:
                  name: assignee_id